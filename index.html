<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodNews for Kids – Gute Nachrichten, die kranken Kindern helfen</title>
<meta name="description" content="Handgeschriebene gute Nachrichten – und wie du kranken Kindern mit einer Spende helfen kannst.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EAF4FB;
    --paper:#FFFFFF;
    --ink:#1B3A4B;
    --ink-soft:#4C6B7A;
    --ink-faint:#8AA4B0;
    --line: rgba(27,58,75,0.12);
    --blue:#4C93C9;
    --blue-ink:#1E4E75;
    --blue-soft:#DCEEFB;
    --blue-deep:#2F7AB8;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(27,58,75,0.05), 0 10px 28px -14px rgba(27,58,75,0.20);
    --shadow-hover: 0 1px 2px rgba(27,58,75,0.06), 0 18px 38px -16px rgba(27,58,75,0.26);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 8% -10%, rgba(76,147,201,0.16), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(47,122,184,0.10), transparent 35%);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  a{color:inherit;}

  /* ---------- Kopfbereich ---------- */
  header.masthead{
    position:sticky;
    top:0;
    z-index:20;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    background:rgba(234,244,251,0.86);
    border-bottom:1px solid var(--line);
  }
  .masthead-inner{
    max-width:1360px;
    margin:0 auto;
    padding:18px 24px 14px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .heart-logo{width:38px;height:38px;flex:0 0 auto;}
  .heart-shape{fill:var(--blue);}
  @media (prefers-reduced-motion: no-preference){
    .heart-logo{transform-origin:20px 20px; animation:heartbeat 2.6s ease-in-out infinite;}
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }

  .brand-text h1{
    margin:0;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(28px,4vw,38px);
    line-height:1;
    letter-spacing:-0.01em;
    color:var(--blue-ink);
  }
  .brand-text p{
    margin:4px 0 0;
    font-size:12.5px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .status-panel{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 0 0 rgba(76,147,201,0.5);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(76,147,201,0.45);}
    70%{box-shadow:0 0 0 8px rgba(76,147,201,0);}
    100%{box-shadow:0 0 0 0 rgba(76,147,201,0);}
  }
  .refresh-btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font:inherit; font-size:13px; font-weight:500;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .refresh-btn:hover{border-color:var(--blue); transform:translateY(-1px);}
  .refresh-btn:active{transform:translateY(0);}
  .refresh-btn svg{width:14px;height:14px;}
  .refresh-btn.is-loading svg{animation:spin-fast 0.9s linear infinite;}
  @keyframes spin-fast{ to{transform:rotate(360deg);} }

  /* ---------- Suchleiste ---------- */
  .filter-bar{
    max-width:1360px;
    margin:0 auto;
    padding:14px 24px 16px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:16px;
  }
  .search-wrap{
    position:relative;
    min-width:220px;
    flex:1 1 220px;
    max-width:320px;
  }
  .search-wrap input{
    width:100%;
    font:inherit; font-size:14px;
    padding:8px 12px 8px 34px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  .search-wrap input:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; color:var(--ink-faint);
  }

  /* ---------- Hauptbereich ---------- */
  main{max-width:1360px; margin:0 auto; padding:8px 24px 80px;}

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
    margin-top:12px;
  }

  .card{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:0 0 18px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, grid-column .2s ease;
  }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow-hover);}
  .card:target{outline:2px solid var(--blue); outline-offset:3px;}
  .card.is-open{
    grid-column:1 / -1;
    transform:none;
  }
  .card.is-open:hover{transform:none;}

  @media (min-width:900px){
    .card.is-open .card-inner{
      display:grid;
      grid-template-columns:340px 1fr;
      gap:24px;
      align-items:start;
    }
    .card.is-open .card-image{
      aspect-ratio:auto;
      height:100%;
      border-radius:12px;
      margin:22px 0 22px 22px;
      width:340px;
    }
    .card.is-open .card-body{padding-left:0;}
  }

  .card-image{
    width:100%;
    aspect-ratio:16/9;
    background:var(--blue-soft);
    overflow:hidden;
    position:relative;
  }
  .card-image img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .badge-new{
    position:absolute; top:12px; left:12px;
    font-size:10.5px; font-weight:700; letter-spacing:0.08em;
    text-transform:uppercase;
    color:#fff; background:var(--blue-deep);
    padding:4px 10px; border-radius:999px;
    animation:fadeGlow 2.6s ease-in-out infinite;
  }
  .badge-new.no-image{
    position:static;
    display:inline-flex;
    align-self:flex-start;
  }
  @keyframes fadeGlow{ 0%,100%{opacity:1;} 50%{opacity:.6;} }

  .card-body{
    padding:0 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card-body.no-image{padding-top:22px;}

  /* ---------- Übersicht: kleines, dezentes Vorschaubild ---------- */
  .card:not(.is-open) .card-inner{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:18px 22px 0;
  }
  .card:not(.is-open) .card-image{
    width:96px;
    height:96px;
    flex:0 0 96px;
    aspect-ratio:1/1;
    border-radius:12px;
  }
  .card:not(.is-open) .card-body,
  .card:not(.is-open) .card-body.no-image{
    padding:0;
  }
  .card:not(.is-open) .badge-new{
    top:4px; left:4px;
    font-size:8px;
    padding:2px 6px;
  }

  .card h2{
    margin:0;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19.5px;
    line-height:1.28;
    cursor:pointer;
  }
  .card.is-open h2{font-size:23px;}

  .excerpt-wrap{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .35s ease;
    cursor:pointer;
  }
  .card.is-open .excerpt-wrap{grid-template-rows:1fr;}
  .excerpt-wrap > div{overflow:hidden; min-height:0;}

  .card p.excerpt{
    margin:0;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink-soft);
    white-space:pre-line;
  }
  .excerpt-full{display:none;}
  .card.is-open .excerpt-short{display:none;}
  .card.is-open .excerpt-full{display:block;}
  /* Sicherheitsnetz, falls die Satz-Erkennung mal einen sehr langen "Satz" liefert */
  .excerpt-short{
    display:-webkit-box;
    -webkit-line-clamp:6;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .read-toggle{
    display:inline-flex;
    align-items:center;
    gap:4px;
    border:none;
    background:none;
    padding:0;
    font:inherit;
    font-size:13px;
    font-weight:700;
    color:var(--blue-deep);
    cursor:pointer;
    align-self:flex-start;
  }
  .read-toggle svg{width:12px;height:12px; transition:transform .25s ease;}
  .card.is-open .read-toggle svg{transform:rotate(180deg);}

  .card-foot{
    padding-top:12px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--ink-faint);
  }

  .card-actions{
    display:flex; align-items:center; gap:10px;
  }
  .share-btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font:inherit; font-size:12.5px; font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .share-btn:hover{border-color:var(--blue); transform:translateY(-1px);}
  .share-btn svg{width:13px;height:13px;}

  .donate-link{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--blue-deep);
    color:#fff;
    font:inherit; font-size:12.5px; font-weight:700;
    padding:8px 14px;
    border-radius:999px;
    text-decoration:none;
    flex:1 1 auto;
    justify-content:center;
    transition:transform .15s ease, opacity .15s ease;
  }
  .donate-link:hover{transform:translateY(-1px); opacity:.92;}
  .donate-link svg{width:13px;height:13px;}

  /* ---------- Zustände: Laden / Fehler / Leer ---------- */
  .skeleton{
    height:280px; border-radius:var(--radius);
    background:linear-gradient(100deg, var(--paper) 30%, var(--blue-soft) 50%, var(--paper) 70%);
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
    border:1px solid var(--line);
  }
  @keyframes shimmer{ 0%{background-position:150% 0;} 100%{background-position:-50% 0;} }

  .state-message{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .state-message h3{
    font-family:'Fraunces', serif; font-weight:600; font-style:italic;
    font-size:22px; color:var(--ink); margin:0 0 8px;
  }
  .state-message p{margin:0 0 16px; font-size:14.5px;}
  .retry-btn{
    border:1px solid var(--blue-ink); background:var(--blue-ink); color:#fff;
    font:inherit; font-size:13.5px; font-weight:600;
    padding:9px 18px; border-radius:999px; cursor:pointer;
  }
  .retry-btn:hover{opacity:.88;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; right:20px; bottom:20px;
    background:var(--blue-ink); color:#fff;
    padding:12px 18px; border-radius:12px;
    font-size:13.5px; font-weight:500;
    box-shadow:0 12px 30px -8px rgba(0,0,0,0.35);
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:30;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast .dot{width:7px;height:7px;border-radius:50%; background:#fff; flex:0 0 auto;}

  footer.site-footer{
    max-width:1360px; margin:0 auto; padding:20px 24px 50px;
    color:var(--ink-faint); font-size:12.5px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
    border-top:1px solid var(--line);
  }

  @media (max-width:560px){
    .masthead-inner{flex-direction:column; align-items:flex-start;}
    .status-panel{width:100%; justify-content:space-between;}
    .card-actions{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <svg class="heart-logo" viewBox="0 0 40 40" aria-hidden="true">
        <path class="heart-shape" d="M20 34.5s-13.4-8.6-13.4-18.1C6.6 10.6 10.7 7 15.2 7c2.4 0 4.6 1.2 5.8 3.2C22.2 8.2 24.4 7 26.8 7c4.5 0 8.6 3.6 8.6 9.4 0 9.5-13.4 18.1-13.4 18.1-.6.4-1.4.4-2 0z"/>
      </svg>
      <div class="brand-text">
        <h1>GoodNews for Kids</h1>
        <p>Gute Nachrichten, geschrieben mit Herz – für kranke Kinder</p>

    <div class="status-panel">
      <span class="live-dot" aria-hidden="true"></span>

      <button class="refresh-btn" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        <span>Aktualisieren</span>
      </button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="search" placeholder="Suchen …" aria-label="Nachrichten durchsuchen">
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<footer class="site-footer">
  <span>Artikel: handgeschrieben · Quelle: GoodNews_App_Elias_Datenbank (Google Sheets)</span>
  <span id="lastUpdated">–</span>
</footer>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script>
/* =====================================================================
   KONFIGURATION
   Diese Werte bei Bedarf anpassen, ohne den Rest des Codes zu ändern.
   ===================================================================== */
const CONFIG = {
  // ID des Google Sheets (aus der URL zwischen /d/ und /edit)
  sheetId: '117-y1JnDuB6QcLW20FW16iIa13YDSFdkx9WgJqTHzsM',

  // GID des Tabs mit den (handgeschriebenen) Artikeln.
  gid: '0',

  // Sheet muss für "Jeder mit Link -> Betrachter" freigegeben sein,
  // sonst schlägt der Live-Abruf fehl.
  refreshMs: 5 * 60 * 1000,       // Auto-Aktualisierung: 5 Minuten
  requestTimeoutMs: 15000,

  // Es werden nie mehr als 5 Artikel gleichzeitig angezeigt.
  maxItems: 50,

  // Standard-Spendenlink, falls im Sheet kein individueller Link
  // in der Spalte "Spendenlink" hinterlegt ist. BITTE ANPASSEN.
  donationUrl: 'https://www.beispiel-spendenlink.ch/',
};

/* ===================================================================== */

const state = {
  all: [],
  searchTerm: '',
  knownKeys: new Set(),
  firstLoad: true,
  loading: false,
  byKey: new Map(),
};

const els = {
  grid: document.getElementById('grid'),
  search: document.getElementById('searchInput'),
  statusText: document.getElementById('statusText'),
  lastUpdated: document.getElementById('lastUpdated'),
  refreshBtn: document.getElementById('refreshBtn'),
  toast: document.getElementById('toast'),
  toastText: document.getElementById('toastText'),
};

function normLabel(label){
  return (label || '').toString().trim().toLowerCase();
}

// Findet die Spaltennummer anhand mehrerer möglicher Spaltentitel
// (falls im Sheet leicht andere Bezeichnungen verwendet werden).
function findCol(cols, candidates){
  for (const c of candidates) {
    const i = cols.indexOf(c);
    if (i >= 0) return i;
  }
  return -1;
}

/* --- Google-Sheet per JSONP laden (kein API-Key, kein CORS-Problem) --- */
function fetchSheet(){
  return new Promise((resolve, reject) => {
    const cbName = 'gviz_' + Math.random().toString(36).slice(2);
    let settled = false;

    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('Zeitüberschreitung beim Laden der Daten.'));
    }, CONFIG.requestTimeoutMs);

    function cleanup(){
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(json){
      if (settled) return;
      settled = true;
      cleanup();
      resolve(json);
    };

    const script = document.createElement('script');
    script.onerror = function(){
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('Das Sheet konnte nicht erreicht werden.'));
    };
    const url = 'https://docs.google.com/spreadsheets/d/' + CONFIG.sheetId +
      '/gviz/tq?tqx=out:json;responseHandler:' + cbName +
      '&gid=' + encodeURIComponent(CONFIG.gid) +
      '&headers=1&_=' + Date.now();
    script.src = url;
    document.body.appendChild(script);
  });
}

// Wandelt gängige Google-Drive-Freigabelinks in einen direkt
// einbettbaren Bildlink um. Normale Bild-URLs bleiben unverändert.
// Bevorzugt ein direkt im Sheet gespeichertes Base64-Bild (kein Google-Drive-
// Umweg nötig). Fällt nur auf einen Bild-Link zurück, wenn keine Base64-
// Daten vorhanden sind. So können beide Spalten parallel existieren.
function toImageSrc(base64Raw, linkRaw){
  const b64 = (base64Raw || '').toString().trim();
  if (b64) {
    if (b64.startsWith('data:image')) return b64;
    // reines Base64 ohne Prefix -> als JPEG interpretieren (Standard für die meisten Fotos)
    return 'data:image/jpeg;base64,' + b64.replace(/\s+/g, '');
  }
  return toImageUrl(linkRaw);
}

function toImageUrl(raw){
  const url = (raw || '').toString().trim();
  if (!url) return '';
  let m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if (m) return 'https://drive.google.com/uc?export=view&id=' + m[1];
  m = url.match(/drive\.google\.com\/open\?id=([^&]+)/);
  if (m) return 'https://drive.google.com/uc?export=view&id=' + m[1];
  m = url.match(/[?&]id=([^&]+)/);
  if (m && url.includes('drive.google.com')) return 'https://drive.google.com/uc?export=view&id=' + m[1];
  return url;
}

function parseRows(json){
  if (!json || !json.table) throw new Error('Unerwartetes Datenformat.');
  const cols = json.table.cols.map(c => normLabel(c.label));

  // Spalten laut Sheet: Publikationsdatum(A) Titel(B) Inhalt(C) Image(D) Spendenlink(E).
  // Zuerst wird nach dem Spaltennamen gesucht; falls der Titel im Sheet
  // nicht exakt erkannt wird (z.B. wegen Leerzeichen/Sonderzeichen),
  // greift ein Fallback auf die feste Position (Spalte D = Index 3).
  const idx = {
    publikationsdatum: withFallback(findCol(cols, ['publikationsdatum', 'datum']), 0),
    titel: withFallback(findCol(cols, ['titel']), 1),
    inhalt: withFallback(findCol(cols, ['inhalt', 'text', 'artikeltext', 'artikel']), 2),
    bild: withFallback(findCol(cols, ['image', 'bild', 'bild-url', 'bildurl', 'foto']), 3),
    spendenlink: withFallback(findCol(cols, ['spendenlink', 'spenden-link', 'spende', 'donation link']), 4),
    // Optionale Spalte mit dem Bild als Base64-Text (siehe Apps-Script unten).
    // Wenn diese Spalte gefüllt ist, wird sie dem Drive-Link vorgezogen.
    bildBase64: findCol(cols, ['bild (base64)', 'bild base64', 'bilddaten', 'bild-daten', 'base64']),
  };

  const rows = (json.table.rows || []).map(r => {
    const cell = i => (i >= 0 && r.c[i] ? r.c[i].v : null);
    // Manche Zellen (z.B. mit HYPERLINK()-Formel) liefern den Link nur
    // im formatierten Feld "f" statt im Wertfeld "v" – beide prüfen.
    const cellRaw = i => (i >= 0 && r.c[i]) ? (r.c[i].v ?? r.c[i].f ?? null) : null;
    return {
      publikationsdatum: cell(idx.publikationsdatum),
      titel: (cell(idx.titel) || '').toString().trim(),
      inhalt: (cell(idx.inhalt) || '').toString().trim(),
      bild: toImageSrc(cellRaw(idx.bildBase64), cellRaw(idx.bild)),
      spendenlink: (cellRaw(idx.spendenlink) || '').toString().trim(),
    };
  });

  return rows.filter(r => !!r.titel);
}

function withFallback(foundIndex, fallbackIndex){
  return foundIndex >= 0 ? foundIndex : fallbackIndex;
}

function toDate(row){
  const d = row.publikationsdatum ? new Date(row.publikationsdatum) : null;
  if (d && !isNaN(d)) return d;
  return new Date(0);
}

function rowKey(row){
  return row.titel + '|' + row.publikationsdatum;
}

function slugify(row){
  return (row.titel || 'artikel')
    .toString().trim().toLowerCase()
    .replace(/[^a-z0-9äöüß]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60);
}

const dateFmt = new Intl.DateTimeFormat('de-CH', { day:'numeric', month:'long', year:'numeric' });

function relativeUpdated(date){
  const diffSec = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
  if (diffSec < 60) return 'gerade eben';
  const min = Math.round(diffSec / 60);
  if (min < 60) return 'vor ' + min + ' Min.';
  const h = Math.round(min / 60);
  if (h < 24) return 'vor ' + h + ' Std.';
  return dateFmt.format(date);
}

// Gibt die ersten "count" Sätze eines Textes zurück (für die Übersicht).
// Erkennt Satzenden an . ! ? – falls keine gefunden werden, wird der
// ganze Text zurückgegeben (Sicherheitsnetz übernimmt dann das Kürzen per CSS).
function firstSentences(text, count){
  const str = (text || '').toString().trim();
  if (!str) return '';
  const matches = str.match(/[^.!?]+[.!?]+(\s+|$)/g);
  if (!matches || matches.length === 0) return str;
  const picked = matches.slice(0, count).join('').trim();
  return picked.length < str.length ? picked + ' …' : picked;
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function render(){
  const term = state.searchTerm.trim().toLowerCase();
  const filtered = state.all
    .filter(r => !term || (r.titel + ' ' + r.inhalt).toLowerCase().includes(term))
    .sort((a,b) => toDate(b) - toDate(a))
    .slice(0, CONFIG.maxItems); // nie mehr als 5 Artikel gleichzeitig

  els.grid.innerHTML = '';
  state.byKey.clear();

  if (filtered.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'state-message';
    msg.innerHTML = '<h3>Keine passenden Nachrichten</h3><p>Für diese Suche gibt es derzeit keine Beiträge. Anderen Suchbegriff versuchen.</p>';
    els.grid.appendChild(msg);
    return;
  }

  filtered.forEach(row => {
    const key = rowKey(row);
    const isNew = !state.firstLoad && state.newKeys && state.newKeys.has(key);
    const date = toDate(row);
    const anchor = slugify(row);
    const hasImage = !!row.bild;
    state.byKey.set(key, row);

    const card = document.createElement('article');
    card.className = 'card';
    card.id = 'artikel-' + anchor;

    card.innerHTML = `
      <div class="card-inner">
        ${hasImage ? `
        <div class="card-image">
          <img src="${escapeHtml(row.bild)}" alt="${escapeHtml(row.titel)}" loading="lazy"
               onerror="console.warn('Bild konnte nicht geladen werden:', this.src); this.closest('.card-image').style.display='none'">
          ${isNew ? '<span class="badge-new">Neu</span>' : ''}
        </div>` : ''}
        <div class="card-body ${hasImage ? '' : 'no-image'}">
          ${(!hasImage && isNew) ? '<span class="badge-new no-image">Neu</span>' : ''}
          <h2 class="card-toggle">${escapeHtml(row.titel)}</h2>
          <div class="excerpt-wrap card-toggle"><div>
            <p class="excerpt excerpt-short">${escapeHtml(firstSentences(row.inhalt, 3))}</p>
            <p class="excerpt excerpt-full">${escapeHtml(row.inhalt)}</p>
          </div></div>
          <button class="read-toggle card-toggle" type="button">
            <span class="read-toggle-label">Weiterlesen</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="card-foot">
            <span>${dateFmt.format(date)}</span>
          </div>
          <div class="card-actions">
            <button class="share-btn" type="button" data-key="${escapeHtml(key)}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
              Teilen
            </button>
            <a class="donate-link" href="${escapeHtml(row.spendenlink || CONFIG.donationUrl)}" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.6c0-3-2.3-5-5-5-1.7 0-3.3 1-4.3 2.6C10.5 4.6 8.9 3.6 7.2 3.6c-2.7 0-5 2-5 5 0 5.4 8.6 10.4 9.3 10.8.2.1.4.1.6 0 .7-.4 9.3-5.4 9.3-10.8z"/></svg>
              Spenden
            </a>
          </div>
        </div>
      </div>
    `;
    els.grid.appendChild(card);
  });
}

function showToast(text){
  els.toastText.textContent = text;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), 4000);
}

async function shareRow(row){
  const anchor = slugify(row);
  const url = location.origin + location.pathname + '#artikel-' + anchor;
  const shareData = {
    title: row.titel,
    text: row.inhalt.length > 140 ? row.inhalt.slice(0, 140).trim() + '…' : row.inhalt,
    url,
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch (e) { /* Nutzer hat abgebrochen */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Link kopiert');
  } catch (e) {
    showToast('Link: ' + url);
  }
}

function showError(message){
  els.grid.innerHTML = `
    <div class="state-message">
      <h3>Nachrichten momentan nicht verfügbar</h3>
      <p>${escapeHtml(message)}</p>
      <button class="retry-btn" id="retryBtn" type="button">Erneut versuchen</button>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', loadData);
}

async function loadData(){
  if (state.loading) return;
  state.loading = true;
  els.refreshBtn.classList.add('is-loading');
  els.statusText.textContent = 'wird aktualisiert …';

  try {
    const json = await fetchSheet();
    const rows = parseRows(json);
    console.log('GoodNews: eingelesene Artikel (zur Fehlersuche der Bild-Spalte):',
      rows.map(r => ({ titel: r.titel, bild: r.bild || '(leer)' })));

    const newKeySet = new Set(rows.map(rowKey));
    state.newKeys = state.firstLoad ? new Set() : new Set(
      [...newKeySet].filter(k => !state.knownKeys.has(k))
    );

    state.all = rows;
    state.knownKeys = newKeySet;

    render();

    const now = new Date();
    els.lastUpdated.textContent = 'Zuletzt geprüft: ' + relativeUpdated(now);
    startCountdown();

    if (!state.firstLoad && state.newKeys.size > 0) {
      showToast(state.newKeys.size === 1
        ? '1 neue gute Nachricht ist da'
        : state.newKeys.size + ' neue gute Nachrichten sind da');
    }
    state.firstLoad = false;
  } catch (err) {
    showError(err.message || 'Unbekannter Fehler beim Laden.');
    els.statusText.textContent = 'Fehler beim Laden';
  } finally {
    state.loading = false;
    els.refreshBtn.classList.remove('is-loading');
  }
}

/* --- Countdown bis zur nächsten automatischen Aktualisierung --- */
let countdownTimer = null;
let nextRefreshAt = null;

function startCountdown(){
  nextRefreshAt = Date.now() + CONFIG.refreshMs;
  clearInterval(countdownTimer);
  countdownTimer = setInterval(updateCountdown, 1000);
  updateCountdown();
}

function updateCountdown(){
  const remaining = Math.max(0, nextRefreshAt - Date.now());
  const m = Math.floor(remaining / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  els.statusText.textContent = 'Live · nächste Aktualisierung in ' + m + ':' + String(s).padStart(2, '0');
}

/* --- Events --- */
els.search.addEventListener('input', e => {
  state.searchTerm = e.target.value;
  render();
});
els.refreshBtn.addEventListener('click', () => {
  if (state.loading) return;
  loadData();
});
els.grid.addEventListener('click', e => {
  const shareBtn = e.target.closest('.share-btn');
  if (shareBtn) {
    const row = state.byKey.get(shareBtn.dataset.key);
    if (row) shareRow(row);
    return;
  }
  const toggle = e.target.closest('.card-toggle');
  if (!toggle) return;
  const card = toggle.closest('.card');
  if (!card) return;
  const isOpen = card.classList.toggle('is-open');
  const label = card.querySelector('.read-toggle-label');
  if (label) label.textContent = isOpen ? 'Weniger anzeigen' : 'Weiterlesen';
  if (!isOpen) {
    // Beim Zuklappen sanft zur Karte zurückscrollen, falls sie aus dem Blickfeld gerutscht ist
    const rect = card.getBoundingClientRect();
    if (rect.top < 0) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

/* --- Start --- */
loadData();
setInterval(loadData, CONFIG.refreshMs);
</script>
