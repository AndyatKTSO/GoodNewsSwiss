<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good News Schweiz – Positive Nachrichten aus Schweiz</title>
<meta name="description" content="Gute Nachrichten aus der Schweiz, automatisch aktualisiert.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF7EE;
    --paper:#FFFEFB;
    --ink:#22302A;
    --ink-soft:#5C6B62;
    --ink-faint:#8B968E;
    --line: rgba(34,48,42,0.12);
    --gold:#D9A441;
    --gold-ink:#7A5717;
    --forest:#3F6B4F;
    --forest-ink:#25422F;
    --sky:#4C7896;
    --sky-ink:#28455A;
    --berry:#9C4F6B;
    --berry-ink:#5C2C3D;
    --teal:#2F8078;
    --teal-ink:#1B4B45;
    --mustard:#A9772F;
    --mustard-ink:#5F421A;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(34,48,42,0.05), 0 10px 28px -14px rgba(34,48,42,0.22);
    --shadow-hover: 0 1px 2px rgba(34,48,42,0.06), 0 18px 38px -16px rgba(34,48,42,0.28);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 8% -10%, rgba(217,164,65,0.16), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(63,107,79,0.10), transparent 35%);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  a{color:inherit;}

  /* ---------- Kopfbereich ---------- */
  header.masthead{
    position:sticky;
    top:0;
    z-index:20;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    background:rgba(251,247,238,0.86);
    border-bottom:1px solid var(--line);
  }
  .masthead-inner{
    max-width:1180px;
    margin:0 auto;
    padding:18px 24px 14px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .sun{width:40px;height:40px;flex:0 0 auto;}
  .sun-core{fill:var(--gold);}
  .sun-ray{stroke:var(--gold); stroke-width:2.4; stroke-linecap:round;}
  @media (prefers-reduced-motion: no-preference){
    .sun-rays{transform-origin:20px 20px; animation:spin 40s linear infinite;}
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .brand-text h1{
    margin:0;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(28px,4vw,38px);
    line-height:1;
    letter-spacing:-0.01em;
  }
  .brand-text p{
    margin:4px 0 0;
    font-size:12.5px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .status-panel{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--forest);
    box-shadow:0 0 0 0 rgba(63,107,79,0.5);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(63,107,79,0.45);}
    70%{box-shadow:0 0 0 8px rgba(63,107,79,0);}
    100%{box-shadow:0 0 0 0 rgba(63,107,79,0);}
  }
  .refresh-btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font:inherit; font-size:13px; font-weight:500;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .refresh-btn:hover{border-color:var(--gold); transform:translateY(-1px);}
  .refresh-btn:active{transform:translateY(0);}
  .refresh-btn svg{width:14px;height:14px;}
  .refresh-btn.is-loading svg{animation:spin-fast 0.9s linear infinite;}
  @keyframes spin-fast{ to{transform:rotate(360deg);} }

  /* ---------- Filterleiste ---------- */
  .filter-bar{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .pills{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font:inherit; font-size:13px; font-weight:500;
    padding:6px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .pill:hover{border-color:var(--gold);}
  .pill[aria-pressed="true"]{
    background:var(--ink);
    color:var(--cream);
    border-color:var(--ink);
  }
  .search-wrap{
    position:relative;
    min-width:220px;
    flex:1 1 220px;
    max-width:320px;
  }
  .search-wrap input{
    width:100%;
    font:inherit; font-size:14px;
    padding:8px 12px 8px 34px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  .search-wrap input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .search-wrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; color:var(--ink-faint);
  }

  /* ---------- Hauptbereich ---------- */
  main{max-width:1180px; margin:0 auto; padding:8px 24px 80px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:20px;
    margin-top:12px;
  }

  .card{
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 22px 18px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:12px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow-hover);}

  .card-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:600;
    letter-spacing:0.05em; text-transform:uppercase;
    padding:4px 10px 4px 8px;
    border-radius:999px;
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;}
  .badge-new{
    font-size:10.5px; font-weight:700; letter-spacing:0.08em;
    color:#fff; background:var(--forest);
    padding:3px 8px; border-radius:999px;
    animation:fadeGlow 2.6s ease-in-out infinite;
  }
  @keyframes fadeGlow{ 0%,100%{opacity:1;} 50%{opacity:.55;} }

  .card h2{
    margin:0;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19.5px;
    line-height:1.28;
  }
  .card p.excerpt{
    margin:0;
    font-size:14.5px;
    line-height:1.55;
    color:var(--ink-soft);
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-foot{
    margin-top:auto;
    padding-top:12px;
    border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    font-size:12.5px;
    color:var(--ink-faint);
    gap:10px;
  }
  .card-foot a{
    font-weight:600;
    color:var(--forest-ink);
    text-decoration:none;
  }
  .card-foot a:hover{text-decoration:underline;}

  /* ---------- Zustände: Laden / Fehler / Leer ---------- */
  .skeleton{
    height:200px; border-radius:var(--radius);
    background:linear-gradient(100deg, var(--paper) 30%, #F1EBDC 50%, var(--paper) 70%);
    background-size:200% 100%;
    animation:shimmer 1.6s ease-in-out infinite;
    border:1px solid var(--line);
  }
  @keyframes shimmer{ 0%{background-position:150% 0;} 100%{background-position:-50% 0;} }

  .state-message{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .state-message h3{
    font-family:'Fraunces', serif; font-weight:600; font-style:italic;
    font-size:22px; color:var(--ink); margin:0 0 8px;
  }
  .state-message p{margin:0 0 16px; font-size:14.5px;}
  .retry-btn{
    border:1px solid var(--ink); background:var(--ink); color:var(--cream);
    font:inherit; font-size:13.5px; font-weight:600;
    padding:9px 18px; border-radius:999px; cursor:pointer;
  }
  .retry-btn:hover{opacity:.88;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; right:20px; bottom:20px;
    background:var(--ink); color:var(--cream);
    padding:12px 18px; border-radius:12px;
    font-size:13.5px; font-weight:500;
    box-shadow:0 12px 30px -8px rgba(0,0,0,0.35);
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:30;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast .dot{width:7px;height:7px;border-radius:50%; background:var(--gold); flex:0 0 auto;}

  footer.site-footer{
    max-width:1180px; margin:0 auto; padding:20px 24px 50px;
    color:var(--ink-faint); font-size:12.5px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
    border-top:1px solid var(--line);
  }

  @media (max-width:560px){
    .masthead-inner{flex-direction:column; align-items:flex-start;}
    .status-panel{width:100%; justify-content:space-between;}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <svg class="sun" viewBox="0 0 40 40" aria-hidden="true">
        <g class="sun-rays">
          <circle class="sun-core" cx="20" cy="20" r="8"></circle>
          <g class="sun-ray">
            <line x1="20" y1="2" x2="20" y2="8"/>
            <line x1="20" y1="32" x2="20" y2="38"/>
            <line x1="2" y1="20" x2="8" y2="20"/>
            <line x1="32" y1="20" x2="38" y2="20"/>
            <line x1="7.5" y1="7.5" x2="11.8" y2="11.8"/>
            <line x1="28.2" y1="28.2" x2="32.5" y2="32.5"/>
            <line x1="32.5" y1="7.5" x2="28.2" y2="11.8"/>
            <line x1="11.8" y1="28.2" x2="7.5" y2="32.5"/>
          </g>
        </g>
      </svg>
      <div class="brand-text">
        <h1>GoodNews Schweiz</h1>
        <p>Positive Nachrichten aus der Schweiz</p>
      </div>
    </div>
    <div class="status-panel">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="statusText">wird geladen …</span>
      <button class="refresh-btn" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Jetzt aktualisieren
      </button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="pills" id="categoryPills" role="group" aria-label="Nach Kategorie filtern">
      <button class="pill" data-cat="__all__" aria-pressed="true" type="button">Alle</button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="search" placeholder="Suchen …" aria-label="Nachrichten durchsuchen">
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<footer class="site-footer">
  <span>Quelle: GoodNews_App_SWISS_Datenbank (Google Sheets)</span>
  <span id="lastUpdated">–</span>
</footer>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script>
/* =====================================================================
   KONFIGURATION
   Diese Werte bei Bedarf anpassen, ohne den Rest des Codes zu ändern.
   ===================================================================== */
const CONFIG = {
  // ID des Google Sheets (aus der URL zwischen /d/ und /edit)
  sheetId: '1Eg9NAGTgClT-EUB_rU24EwZtsd7po8BUvQv4rgKGFjk',

  // GID des Tabs "Publizierte_Meldungen" – hier liegen ausschliesslich
  // bereits freigegebene Beiträge, daher wird nicht mehr nach Status
  // oder Ist_positiv gefiltert.
  gid: '264607036',

  // Sheet muss für "Jeder mit Link -> Betrachter" freigegeben sein,
  // sonst schlägt der Live-Abruf fehl.
  refreshMs: 5 * 60 * 1000,       // Auto-Aktualisierung: 5 Minuten
  requestTimeoutMs: 15000,
  maxItems: 60,
};

const CATEGORY_PALETTE = [
  { bg:'#F5E6C8', ink:'#7A5717', dot:'#D9A441' }, // gold
  { bg:'#DCE9DF', ink:'#25422F', dot:'#3F6B4F' }, // forest
  { bg:'#DCE7ED', ink:'#28455A', dot:'#4C7896' }, // sky
  { bg:'#EEDCE2', ink:'#5C2C3D', dot:'#9C4F6B' }, // berry
  { bg:'#DAEAE7', ink:'#1B4B45', dot:'#2F8078' }, // teal
  { bg:'#EDE0CC', ink:'#5F421A', dot:'#A9772F' }, // mustard
];

/* ===================================================================== */

const state = {
  all: [],
  activeCategory: '__all__',
  searchTerm: '',
  knownKeys: new Set(),
  firstLoad: true,
  loading: false,
};

const els = {
  grid: document.getElementById('grid'),
  pills: document.getElementById('categoryPills'),
  search: document.getElementById('searchInput'),
  statusText: document.getElementById('statusText'),
  lastUpdated: document.getElementById('lastUpdated'),
  refreshBtn: document.getElementById('refreshBtn'),
  toast: document.getElementById('toast'),
  toastText: document.getElementById('toastText'),
};

function categoryStyle(name){
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return CATEGORY_PALETTE[hash % CATEGORY_PALETTE.length];
}

function normLabel(label){
  return (label || '').toString().trim().toLowerCase();
}

/* --- Google-Sheet per JSONP laden (kein API-Key, kein CORS-Problem) --- */
function fetchSheet(){
  return new Promise((resolve, reject) => {
    const cbName = 'gviz_' + Math.random().toString(36).slice(2);
    let settled = false;

    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('Zeitüberschreitung beim Laden der Daten.'));
    }, CONFIG.requestTimeoutMs);

    function cleanup(){
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(json){
      if (settled) return;
      settled = true;
      cleanup();
      resolve(json);
    };

    const script = document.createElement('script');
    script.onerror = function(){
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error('Das Sheet konnte nicht erreicht werden.'));
    };
    const url = 'https://docs.google.com/spreadsheets/d/' + CONFIG.sheetId +
      '/gviz/tq?tqx=out:json;responseHandler:' + cbName +
      '&gid=' + encodeURIComponent(CONFIG.gid) +
      '&headers=1&_=' + Date.now();
    script.src = url;
    document.body.appendChild(script);
  });
}

function parseRows(json){
  if (!json || !json.table) throw new Error('Unerwartetes Datenformat.');
  const cols = json.table.cols.map(c => normLabel(c.label));
  const idx = {
    zeitstempel: cols.indexOf('zeitstempel'),
    kategorie: cols.indexOf('kategorie'),
    titel: cols.indexOf('titel'),
    inhalt: cols.indexOf('inhalt'),
    quelleName: cols.indexOf('quelle_name'),
    quelleUrl: cols.indexOf('quelle_url'),
    status: cols.indexOf('status'),
    publikationsdatum: cols.indexOf('publikationsdatum'),
    istPositiv: cols.indexOf('ist_positiv'),
  };

  const rows = (json.table.rows || []).map(r => {
    const cell = i => (i >= 0 && r.c[i] ? r.c[i].v : null);
    return {
      zeitstempel: cell(idx.zeitstempel),
      kategorie: (cell(idx.kategorie) || 'Allgemein').toString().trim(),
      titel: (cell(idx.titel) || '').toString().trim(),
      inhalt: (cell(idx.inhalt) || '').toString().trim(),
      quelleName: (cell(idx.quelleName) || '').toString().trim(),
      quelleUrl: (cell(idx.quelleUrl) || '').toString().trim(),
      status: (cell(idx.status) || '').toString().trim(),
      publikationsdatum: cell(idx.publikationsdatum),
      istPositiv: idx.istPositiv >= 0 ? cell(idx.istPositiv) : true,
    };
  });

  // Der Tab "Publizierte_Meldungen" enthält nur bereits freigegebene
  // Beiträge, daher genügt hier ein einfacher Check auf einen Titel.
  return rows.filter(r => !!r.titel);
}

function toDate(row){
  const d1 = row.publikationsdatum ? new Date(row.publikationsdatum) : null;
  if (d1 && !isNaN(d1)) return d1;
  const d2 = row.zeitstempel ? new Date(row.zeitstempel) : null;
  if (d2 && !isNaN(d2)) return d2;
  return new Date(0);
}

function rowKey(row){
  return row.zeitstempel || (row.titel + '|' + row.quelleUrl);
}

const dateFmt = new Intl.DateTimeFormat('de-CH', { day:'numeric', month:'long', year:'numeric' });

function relativeUpdated(date){
  const diffSec = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
  if (diffSec < 60) return 'gerade eben';
  const min = Math.round(diffSec / 60);
  if (min < 60) return 'vor ' + min + ' Min.';
  const h = Math.round(min / 60);
  if (h < 24) return 'vor ' + h + ' Std.';
  return dateFmt.format(date);
}

function buildCategoryPills(){
  const cats = Array.from(new Set(state.all.map(r => r.kategorie))).sort((a,b)=>a.localeCompare(b,'de'));
  els.pills.querySelectorAll('.pill[data-cat]:not([data-cat="__all__"])').forEach(el => el.remove());
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.type = 'button';
    btn.dataset.cat = cat;
    btn.setAttribute('aria-pressed', cat === state.activeCategory ? 'true' : 'false');
    btn.textContent = cat;
    btn.addEventListener('click', () => {
      state.activeCategory = cat;
      syncPillState();
      render();
    });
    els.pills.appendChild(btn);
  });
}

function syncPillState(){
  els.pills.querySelectorAll('.pill').forEach(el => {
    el.setAttribute('aria-pressed', el.dataset.cat === state.activeCategory ? 'true' : 'false');
  });
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function render(){
  const term = state.searchTerm.trim().toLowerCase();
  const filtered = state.all
    .filter(r => state.activeCategory === '__all__' || r.kategorie === state.activeCategory)
    .filter(r => !term || (r.titel + ' ' + r.inhalt + ' ' + r.quelleName).toLowerCase().includes(term))
    .sort((a,b) => toDate(b) - toDate(a))
    .slice(0, CONFIG.maxItems);

  els.grid.innerHTML = '';

  if (filtered.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'state-message';
    msg.innerHTML = '<h3>Keine passenden Nachrichten</h3><p>Für diese Auswahl gibt es derzeit keine Beiträge. Anderen Filter oder Suchbegriff versuchen.</p>';
    els.grid.appendChild(msg);
    return;
  }

  filtered.forEach(row => {
    const style = categoryStyle(row.kategorie);
    const key = rowKey(row);
    const isNew = !state.firstLoad && state.newKeys && state.newKeys.has(key);
    const date = toDate(row);

    const card = document.createElement('article');
    card.className = 'card';

    card.innerHTML = `
      <div class="card-top">
        <span class="badge" style="background:${style.bg}; color:${style.ink};">
          <span class="dot" style="background:${style.dot};"></span>${escapeHtml(row.kategorie)}
        </span>
        ${isNew ? '<span class="badge-new">Neu</span>' : ''}
      </div>
      <h2>${escapeHtml(row.titel)}</h2>
      <p class="excerpt">${escapeHtml(row.inhalt)}</p>
      <div class="card-foot">
        <span>${dateFmt.format(date)}</span>
        ${row.quelleUrl
          ? `<a href="${escapeHtml(row.quelleUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(row.quelleName || 'Quelle')} ↗</a>`
          : `<span>${escapeHtml(row.quelleName || '')}</span>`}
      </div>
    `;
    els.grid.appendChild(card);
  });
}

function showToast(text){
  els.toastText.textContent = text;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), 4000);
}

function showError(message){
  els.grid.innerHTML = `
    <div class="state-message">
      <h3>Nachrichten momentan nicht verfügbar</h3>
      <p>${escapeHtml(message)}</p>
      <button class="retry-btn" id="retryBtn" type="button">Erneut versuchen</button>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', loadData);
}

async function loadData(){
  if (state.loading) return;
  state.loading = true;
  els.refreshBtn.classList.add('is-loading');
  els.statusText.textContent = 'wird aktualisiert …';

  try {
    const json = await fetchSheet();
    const rows = parseRows(json);

    const newKeySet = new Set(rows.map(rowKey));
    state.newKeys = state.firstLoad ? new Set() : new Set(
      [...newKeySet].filter(k => !state.knownKeys.has(k))
    );

    state.all = rows;
    state.knownKeys = newKeySet;

    buildCategoryPills();
    render();

    const now = new Date();
    els.lastUpdated.textContent = 'Zuletzt geprüft: ' + relativeUpdated(now);
    startCountdown();

    if (!state.firstLoad && state.newKeys.size > 0) {
      showToast(state.newKeys.size === 1
        ? '1 neue gute Nachricht ist da'
        : state.newKeys.size + ' neue gute Nachrichten sind da');
    }
    state.firstLoad = false;
  } catch (err) {
    showError(err.message || 'Unbekannter Fehler beim Laden.');
    els.statusText.textContent = 'Fehler beim Laden';
  } finally {
    state.loading = false;
    els.refreshBtn.classList.remove('is-loading');
  }
}

/* --- Countdown bis zur nächsten automatischen Aktualisierung --- */
let countdownTimer = null;
let nextRefreshAt = null;

function startCountdown(){
  nextRefreshAt = Date.now() + CONFIG.refreshMs;
  clearInterval(countdownTimer);
  countdownTimer = setInterval(updateCountdown, 1000);
  updateCountdown();
}

function updateCountdown(){
  const remaining = Math.max(0, nextRefreshAt - Date.now());
  const m = Math.floor(remaining / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  els.statusText.textContent = 'Live · nächste Aktualisierung in ' + m + ':' + String(s).padStart(2, '0');
}

/* --- Events --- */
els.pills.addEventListener('click', e => {
  const btn = e.target.closest('.pill[data-cat="__all__"]');
  if (btn) {
    state.activeCategory = '__all__';
    syncPillState();
    render();
  }
});
els.search.addEventListener('input', e => {
  state.searchTerm = e.target.value;
  render();
});
els.refreshBtn.addEventListener('click', () => { loadData(); });

/* --- Start --- */
loadData();
setInterval(loadData, CONFIG.refreshMs);
</script>
